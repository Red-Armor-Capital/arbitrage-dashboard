services:
  - type: web
    name: red-armor-equity-carry-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: CARRY_DATABASE_PATH
        value: /tmp/carry.duckdb
      - key: CARRY_REFRESH_SECONDS
        value: "60"
      - key: CARRY_US_EQUITY_REFRESH_SECONDS
        value: "60"
      - key: CARRY_ENABLED_VENUES
        value: lighter,extended,xyz,hotstuff,orderly,us_equity,kr_equity,hk_equity,jp_equity
      - key: CARRY_PREDICTION_COLLECTION_ENABLED
        value: "false"
      - key: CARRY_MANUAL_REFRESH_ENABLED
        value: "false"
      - key: CARRY_CURRENT_MARKET_MAX_AGE_SECONDS
        value: "120"
      - key: CARRY_FRONTEND_ORIGINS
        sync: false
      - key: CARRY_FRONTEND_ORIGIN_REGEX
        value: ""
